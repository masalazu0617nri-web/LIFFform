<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フォームへ移動中...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
      text-align: center;
      color: #333;
    }
  </style>
</head>
<body>
  <p id="status">LINEプロフィールを取得してフォームを開いています...</p>

  <script>
    const LIFF_ID = "あなたのLIFF_ID";
    // 「事前入力済みリンクを取得」で作ったURLの ? より前の部分（.../viewform）
    const FORM_BASE_URL = "https://docs.google.com/forms/d/e/あなたのフォームID/viewform";
    // 「LINE表示名」質問の entry.番号 に書き換える
    const ENTRY_DISPLAY_NAME = "entry.123456789";
    // 「LINEユーザーID」質問も作る場合はその entry.番号 を設定（使わない場合は空文字 "" でOK）
    const ENTRY_USER_ID = "";

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();

        const params = new URLSearchParams({
          usp: "pp_url",
          [ENTRY_DISPLAY_NAME]: profile.displayName
        });

        if (ENTRY_USER_ID) {
          params.set(ENTRY_USER_ID, profile.userId);
        }

        const targetUrl = `${FORM_BASE_URL}?${params.toString()}`;
        location.replace(targetUrl);
      } catch (err) {
        console.error(err);
        document.getElementById("status").textContent =
          "LINE情報の取得に失敗しました。画面を再読み込みしてください。";
      }
    }

    init();
  </script>
</body>
</html>
